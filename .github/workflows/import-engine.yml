name: Recover KeenAC engine sources

on:
  push:
    branches: [main]
    paths:
      - "engine-import/IMPORT_READY"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Recover valid tar members from staged bundle
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .recovered
          cat engine-import/*.b64 | base64 --decode > /tmp/keenac-engine.tar.xz
          xz -dc --ignore-check /tmp/keenac-engine.tar.xz > /tmp/keenac-engine-partial.tar 2>/tmp/xz-recovery.log || true
          cat /tmp/xz-recovery.log
          tar --ignore-zeros -xf /tmp/keenac-engine-partial.tar -C .recovered 2>/tmp/tar-recovery.log || true
          cat /tmp/tar-recovery.log
          echo "Recovered source files:"
          find .recovered -type f | sort | sed -n '1,240p'
          echo "Recovered check classes:"
          find .recovered/main/dev/keenac/engine/core/check/impl -name '*Check.java' -type f 2>/dev/null | sort || true
          count="$(find .recovered/main/dev/keenac/engine/core/check/impl -name '*Check.java' -type f 2>/dev/null | wc -l)"
          echo "Recovered checks: $count"
          test -f .recovered/main/dev/keenac/engine/core/compensation/TransactionManager.java
          test -f .recovered/main/dev/keenac/engine/core/player/TrackedPlayer.java
          test "$count" -ge 30
          mkdir -p recovered-engine
          cp -R .recovered/. recovered-engine/
          rm -rf .recovered
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered-engine
          git commit -m "Recover valid KeenAC engine source files"
          git push

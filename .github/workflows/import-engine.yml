name: Import KeenAC check engine

on:
  push:
    branches: [main]
    paths:
      - "engine-import/IMPORT_READY"

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Import engine sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .engine-import
          cat engine-import/*.b64 | base64 --decode > /tmp/keenac-engine.tar.xz
          tar -xJf /tmp/keenac-engine.tar.xz -C .engine-import

          test -f .engine-import/main/dev/keenac/KeenAC.java
          test -f .engine-import/main/dev/keenac/listener/CorePlayerLifecycleListener.java
          test "$(find .engine-import/main/dev/keenac/engine/core/check/impl -name '*Check.java' | wc -l)" -eq 60

          mkdir -p src/main/java/dev/keenac/engine
          mkdir -p src/main/java/dev/keenac/listener
          mkdir -p src/test/java/dev/keenac/engine

          cp .engine-import/main/dev/keenac/KeenAC.java src/main/java/dev/keenac/KeenAC.java
          cp .engine-import/main/dev/keenac/listener/CorePlayerLifecycleListener.java src/main/java/dev/keenac/listener/
          cp -R .engine-import/main/dev/keenac/engine/. src/main/java/dev/keenac/engine/
          cp -R .engine-import/test/dev/keenac/engine/. src/test/java/dev/keenac/engine/

          rm -f src/main/java/dev/keenac/listener/AlertLifecycleListener.java
          rm -rf engine-import .engine-import
          rm -f /tmp/keenac-engine.tar.xz

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import KeenAC checks, player tracking and latency compensation"
          git push

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test plugin
        run: gradle build --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: KeenAC-1.0.0-engine
          path: build/libs/KeenAC-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

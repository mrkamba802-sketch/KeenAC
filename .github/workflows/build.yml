name: Build KeenAC

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build plugin
        run: gradle --no-daemon clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: KeenAC-${{ github.sha }}
          path: build/libs/KeenAC-*.jar
          if-no-files-found: error
          retention-days: 30

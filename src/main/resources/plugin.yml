name: KeenAC
version: '${version}'
main: dev.keenac.KeenAC
api-version: '1.21'
authors: [MrKamba, Its_Ronex]
description: KeenAC movement diagnostics and checks powered by PacketEvents.
depend: [packetevents]
commands:
  keenac:
    description: KeenAC administration commands
    usage: /keenac <alerts|review <player>|reload>
    aliases: [kac]
permissions:
  keenac.use:
    description: Allows access to KeenAC commands.
    default: op
  keenac.alerts:
    description: Allows receiving and toggling KeenAC alerts.
    default: op
  keenac.reload:
    description: Allows reloading KeenAC configuration.
    default: op

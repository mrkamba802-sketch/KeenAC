# KeenAC configuration
# All distances are measured in blocks; time values are in seconds or server ticks as noted.

checks:
  air-stuck:
    enabled: true
    # Consecutive server ticks with no position change while server-side
    # vertical velocity confirms the player should be falling.
    stationary-ticks: 40
    # Extra consecutive confirmed samples required before AirStuck flags.
    confirm-samples: 5
    movement-tolerance: 0.02
    velocity-tolerance: 0.18
    max-ping-ms: 250
    # AirStuck is alert-only: it never blocks actions or changes the player's camera.
    cancel-actions: false
    shake-player: false
    shake-strength: 0.0
    # Briefly pause AirStuck after a valid Ender Pearl throw (server ticks).
    pearl-grace-ticks: 200

  wall-hit:
    enabled: true
    # Cancel attacks when the target cannot be seen through blocks.
    cancel-hits: true

  no-slow:
    enabled: true
    # Consecutive suspicious movement samples required before an alert.
    required-samples: 5
    # Cancel item consumption after a confirmed violation.
    cancel-consume: true
    # Allow NoSlow to interrupt food use after a confirmed violation.
    # Set false to keep food use uninterrupted while still detecting NoSlow.
    reset-food: true
    potion-effects: true
    block-friction: true

  no-web:
    enabled: true
    # Maximum allowed player displacement in one movement event while inside cobweb.
    max-move-distance: 0.08

  auto-swap:
    enabled: true
    # PacketEvents CLICK_WINDOW / SWAP events, including swaps in open containers.
    # Hotbar keys (0-8) and offhand key (40) are counted. Alerts are advisory.
    required-swaps: 8
    window-ms: 1500
    alert-cooldown-ms: 5000

  motion:
    enabled: true
    # Five independently sampled anomalies inside this rolling window trigger an alert.
    required-suspicions: 5
    suspicion-window-ms: 3000
    # Prevent repeated alerts while the current review is active.
    review-window-ms: 3000
    # Ignore movement shortly after server-side velocity changes (knockback, explosions, etc.).
    velocity-grace-ms: 1200
    # Ignore Motion samples briefly when elytra gliding starts or stops.
    glide-grace-ms: 3000
    max-ping-ms: 250
    hover:
      # Require a sustained near-stationary vertical position while airborne.
      vertical-tolerance: 0.015
      velocity-tolerance: 0.035
      confirm-ticks: 12
    # On a confirmed Motion violation, return to the latest recent jump origin
    # and freeze all positional movement for the configured duration.
    setback:
      enabled: true
      # Only use a jump origin saved recently (milliseconds).
      jump-origin-max-age-ms: 3000
      # Extended hard positional freeze after the rollback (milliseconds).
      freeze-duration-ms: 3500
      # Maximum age of the last grounded rollback point when no recent jump exists.
      safe-position-max-age-ms: 15000
    # PacketEvents horizontal movement analysis; includes Speed and strafe acceleration.
    speed:
      multiplier: 1.30
      buffer-bps: 0.55
      confirm-samples: 3
    packet-alert-cooldown-ms: 400
    # Log potion effects, effective movement attribute, velocity and movement states to console.
    log-context: true

  no-fall:
    enabled: true
    # Ignore short falls and require repeated client onGround claims.
    minimum-fall-distance: 3.0
    required-packets: 2
    packet-window-ms: 750
    max-ping-ms: 250
    alert-cooldown-ms: 2000
    # On a confirmed NoFall violation, return to the latest safe ground position.
    setback:
      enabled: true
      safe-position-max-age-ms: 30000
    # Apply fall damage after rollback if the player suppressed a damaging fall.
    # Base amount follows ceil(fallDistance - 3).
    damage:
      enabled: true
    log-context: true

  elytra-speed:
    enabled: true
    # Maximum allowed averaged 3D flight speed, measured over a 400 ms packet window.
    max-bps: 45.1
    # Consecutive over-limit smoothed windows required to confirm a violation.
    confirm-samples: 2
    max-ping-ms: 250
    alert-cooldown-ms: 1500
    log-context: true
    setback:
      enabled: true
      # Return to the last grounded position if it is still reasonably recent.
      safe-position-max-age-ms: 30000
      # Stop elytra flight and hard-freeze movement after the rollback.
      freeze-duration-ms: 2500

  baritone:
    enabled: true
    # Only review stable, on-ground navigation with a low, steady ping.
    max-ping-ms: 220
    # Repeated route-shape analysis window and required matching turn sequence.
    observation-window-ms: 45000
    pattern-segments: 4
    required-repeats: 3
    # A repeat must keep both turn angle and distance between turns consistent.
    angle-tolerance-degrees: 10.0
    segment-distance-tolerance: 0.40
    minimum-turn-degrees: 25.0
    maximum-turn-degrees: 155.0
    minimum-segment-distance: 1.0
    maximum-segment-distance: 12.0
    yaw-turn-tolerance-degrees: 28.0
    alert-cooldown-ms: 15000
    # Advisory only: Baritone is not directly identifiable from movement packets.
    # This check alerts on repeated automated-looking ground-navigation patterns.
    log-context: true

  aura:
    enabled: true
    # Conservative horizontal facing threshold; repeated hits are required.
    max-angle-degrees: 110.0
    required-hits: 3
    window-ms: 1500
    flag-duration-ms: 900
    alert-cooldown-ms: 5000
    max-distance: 5.0

  reach:
    enabled: true
    # Base survival reach. Ping adds a small bounded tolerance; it never disables this check.
    base-distance: 3.10
    # The target hitbox is rewound by attacker ping, up to this maximum.
    max-rewind-ms: 500
    # Additional reach allowance grows with ping but is capped at max-ping-buffer.
    ping-buffer-per-ms: 0.002
    max-ping-buffer: 0.85
    # Repeated suspicious attack packets are required before alerting/cancelling.
    required-hits: 3
    window-ms: 2500
    alert-cooldown-ms: 3000
    cancel-hits: true

  inv-hit:
    enabled: true
    # Cancel attack packets and alert when a player attacks while a server GUI is open.
    cancel-hits: true
    # The normal E inventory screen is client-side; detect window-0 clicks and
    # retain a short best-effort signal for attacks immediately after a click.
    personal-inventory-click-grace-ms: 650

alerts:
  enabled: true
  # Minimum delay between alerts for the same player and check.
  # Set to 3 to use the originally requested three-second interval.
  delay-seconds: 3
  # Send alerts to console as well as opted-in staff.
  console: true
  # Supports legacy & color codes and placeholders:
  # {prefix}, {player}, {check}, {vl}
  format: "{prefix} &f{player} &7failed &c{check} &8(x{vl})"
  prefix: "&bKeenAC &8»"

  # Automatically enable alert reception for players with keenac.alerts permission.
  auto-enable-for-staff: true

commands:
  # Permission nodes are also declared in plugin.yml.
  use-permission: "keenac.use"
  alerts-permission: "keenac.alerts"
  reload-permission: "keenac.reload"

# KeenAC core configuration
# Each check can be tuned independently. Changes apply with /keenac reload.

evidence:
  enabled: true
  max-players: 512
  max-per-player: 40

alerts:
  enabled: true
  delay-seconds: 3
  console: true
  format: "{prefix} &f{player} &7failed &c{check} &8(x{vl})"
  prefix: "&bKeenAC &8»"
  auto-enable-for-staff: true

commands:
  use-permission: "keenac.use"
  alerts-permission: "keenac.alerts"
  reload-permission: "keenac.reload"
  review-permission: "keenac.review"

checks:
  # Used only when a check does not define its own value below.

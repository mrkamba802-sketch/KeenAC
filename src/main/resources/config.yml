# KeenAC configuration
# All distances are measured in blocks; time values are in seconds or server ticks as noted.

checks:
  combat:
    autoclicker:
      enabled: true
      min-interval-ms: 20.0
      max-interval-ms: 500.0
      sample-size: 32
      minimum-samples: 20
      mean-min-ms: 48.0
      mean-max-ms: 160.0
      max-standard-deviation-ms: 1.35
      confirm-windows: 2
    backtrack:
      enabled: true
      target-movement-max-age-ms: 180
      max-ping-ms: 150
      min-target-displacement: 0.55
      min-distance: 3.65
      max-distance: 5.25
      confirm-hits: 3
    criticals:
      enabled: true
      min-downward-velocity: 0.11
      max-downward-velocity: 0.50
      upward-tolerance: 0.01
      confirm-attacks: 4
    fast-heal:
      # Disabled by default: the upstream heuristic targets legacy protocols 5-107.
      enabled: false
      minimum-consume-interval-ms: 1250
      confirm-intervals: 2
    hitboxes:
      enabled: true
      max-ping-ms: 120
      min-distance: 3.2
      max-distance: 4.4
      look-distance: 4.5
      confirm-hits: 3
    kill-aura:
      enabled: true
      window-ms: 1000
      max-distinct-targets: 4
      confirm-windows: 2
    macro:
      enabled: true
      min-movement-delta: 0.025
      direction-deadzone: 0.025
      sequence-length: 12
      confirm-repeats: 2
    multi-interact:
      enabled: true
      window-ms: 50
      max-distinct-targets: 1
    self-interact:
      enabled: true
    interact-cursor:
      enabled: true
      max-distance: 4.5
      confirm-interactions: 3
    crystal:
      enabled: true
      stale-entity-ms: 60000
      buffer-decay-window-ms: 100
      fast-cycle-window-ms: 40
      fast-buffer-add: 2.0
      fast-buffer-threshold: 6.0
      fast-buffer-reset: 3.0
      fast-buffer-decay: 0.25
      idle-buffer-decay: 0.1
      spawn-tick-window-ms: 50
      spawn-buffer-add: 1.5
      spawn-buffer-threshold: 5.0
    sword-block:
      # Legacy sword blocking (1.7-1.8) is not supported on modern 1.21 combat.
      enabled: false

  movement:
    air-liquid-break:
      enabled: true
      falling-velocity: 0.10
      confirm-samples: 3
    air-liquid-place:
      enabled: true
      falling-velocity: 0.10
      confirm-samples: 3
    far-break:
      enabled: true
      min-distance: 6.0
      max-distance: 12.0
      confirm-samples: 2
    far-place:
      enabled: true
      max-distance: 6.0
      confirm-samples: 2
    fast-break:
      enabled: true
      max-break-time-ms: 90
      confirm-samples: 2
    gravity:
      enabled: true
      min-sample-interval-ms: 40
      stale-sample-interval-ms: 250
      max-step-ticks: 4
      gravity-per-tick: 0.08
      vertical-drag: 0.98
      minimum-horizontal-delta: 0.04
      teleport-grace-ms: 500
      velocity-grace-ms: 500
      max-deviation: 0.26
      confirm-samples: 8
    simulation:
      enabled: true
      max-deviation: 0.18
      confirm-samples: 12
    velocity:
      enabled: true
      minimum-impulse: 0.32
      max-ping-ms: 160
      review-after-ms: 200
      obstruction-distance: 0.60
      expected-displacement-multiplier: 2.0
      minimum-expected-displacement: 0.55
      minimum-response-ratio: 0.20
      confirm-impulses: 2
    elytra:
      enabled: true
      hover-vertical-tolerance: 0.005
      hover-confirm-ticks: 40
      firework-grace-ms: 2500
      kick-boost-start-ticks: 3
      kick-boost-min-ascent: 0.50
      kick-boost-confirm-samples: 2
      ascent-grace-ticks: 5
      ascent-min-delta: 0.12
      ascent-confirm-samples: 4
    ground-spoof:
      enabled: true
      confirm-samples: 4
    illegal-move:
      enabled: true
      world-margin: 64
      max-position-jump: 8.0
      teleport-grace-ms: 1500
      confirm-samples: 2
    invalid-break:
      enabled: true
      confirm-samples: 3
    invalid-place:
      enabled: true
      confirm-samples: 2
    invalid-place-cursor:
      enabled: true
      max-distance: 6.0
      confirm-samples: 3
    multi-break:
      enabled: true
      window-ms: 50
      max-packets: 2
    multi-place:
      enabled: true
      window-ms: 50
      max-packets: 2
    no-fall:
      enabled: true
      min-fall-distance: 3.0
      confirm-samples: 2
    no-swing:
      enabled: true
      grace-ms: 350
      confirm-samples: 3
    omni-sprint:
      enabled: true
      minimum-horizontal-delta: 0.08
      maximum-forward-dot: -0.35
      confirm-samples: 4
    phase:
      enabled: true
      minimum-horizontal-delta: 0.65
      maximum-horizontal-delta: 2.5
      ray-height-offset: 0.9
      ray-end-margin: 0.15
      confirm-samples: 2
    position-break:
      enabled: true
      min-distance: 5.2
      max-distance: 8.0
      confirm-samples: 2
    position-place:
      enabled: true
      min-distance: 5.2
      max-distance: 8.0
      confirm-samples: 2
    rotation-break:
      enabled: true
      max-distance: 5.5
      max-angle-degrees: 72.0
      confirm-samples: 3
    rotation-place:
      enabled: true
      max-distance: 5.5
      max-angle-degrees: 72.0
      confirm-samples: 3
    scaffold-support:
      enabled: true
      minimum-feet-gap: -0.15
      maximum-feet-gap: 1.25
      confirm-placements: 5
    step:
      enabled: true
      minimum-height: 0.85
      maximum-height: 1.6
      minimum-horizontal-delta: 0.05
      velocity-grace-ms: 500
      confirm-samples: 2
    timer:
      enabled: true
      window-ms: 1000
      max-packets: 28
      confirm-windows: 3
    wrong-break:
      enabled: true
      match-grace-ms: 500

  packet:
    bad-packets:
      enabled: true
      world-margin: 64
      max-yaw-degrees: 180.0
      max-pitch-degrees: 90.0
      confirm-invalid-rotations: 3
    chat:
      enabled: true
      minute-window-ms: 60000
      max-messages-per-minute: 60
      burst-window-ms: 2000
      max-burst-messages: 4
      confirm-minute-windows: 2
      confirm-burst-windows: 2
    chest-stealer:
      enabled: true
      burst-window-ms: 500
      max-clicks-per-burst: 6
      confirm-bursts: 3
      max-clicks-per-session: 40
    client-brand:
      enabled: true
      # Reported brand strings are review signals only, not proof of cheating.
      review-brands:
        - wurst
        - liquidbounce
        - rusherhack
        - meteor
        - inertia
        - aristois
        - rise
        - vape
        - phobos
        - salhack
        - tenacity
    crash:
      enabled: true
      max-chat-length: 32767
      max-plugin-message-bytes: 32767
    creative:
      enabled: true
      min-slot: -1
      max-slot: 60
      action-window-ms: 50
      max-actions-per-window: 5
    exploit:
      enabled: true
      min-window-id: 0
      max-window-id: 200
      min-slot: -1
      max-slot: 60
      min-entity-id: -1
      max-entity-id: 20000
    inventory:
      enabled: true
      click-window-ms: 1000
      max-clicks-per-window: 20
    packet-order:
      enabled: true
      burst-window-ms: 100
      max-packets-per-window: 70
      confirm-windows: 3
      duplicate-samples: 12
    sprint:
      enabled: true
      toggle-window-ms: 1000
      max-toggles-per-window: 4
      confirm-windows: 3
    transaction:
      enabled: true
      probe-interval-ticks: 40
      minimum-timeout-ms: 2500
      maximum-timeout-ms: 8000
      ping-multiplier: 3
      ping-offset-ms: 1000
      review-window-ms: 10000
      missing-probes-confirm: 3
      unmatched-pong-confirm: 2
    vehicle:
      enabled: true
      steer-window-ms: 50
      max-steer-packets-per-window: 3
      confirm-burst-windows: 3
      max-input-magnitude: 2.0
      invalid-interact-confirmations: 4

  # Shared server-authoritative correction used by Motion and NoSlow.
  movement-setback:
    enabled: true
    # Preserve fractional coordinates and add a tiny offset against attempted movement.
    micro-offset: 0.002
    # Briefly reject movement/velocity immediately after a rubberband (milliseconds).
    correction-lock-ms: 120
    # Collapse simultaneous flags from multiple movement checks.
    dedupe-ms: 80

  air-stuck:
    enabled: true
    # Faster confirmation while still requiring stable ping and downward velocity.
    stationary-ticks: 24
    # Consecutive confirmed samples required before block actions are restricted.
    confirm-samples: 2
    movement-tolerance: 0.02
    velocity-tolerance: 0.18
    max-ping-ms: 250
    # Cancel block breaking and placement while a confirmed AirStuck flag is active.
    # Other actions and movement are not affected.
    cancel-actions: true
    shake-player: false
    shake-strength: 0.0
    # Briefly pause AirStuck after a valid Ender Pearl throw (server ticks).
    pearl-grace-ticks: 200

  aura:
    enabled: true
    # Repeated attacks from clearly off-angle directions are reviewed.
    max-angle-degrees: 110.0
    required-hits: 3
    window-ms: 1500
    flag-duration-ms: 900
    max-distance: 5.0

  wall-hit:
    enabled: true
    # Cancel attacks when the target cannot be seen through blocks.
    cancel-hits: true

  wall-interact:
    enabled: true
    # Advisory mode by default: report suspected wall interactions without cancelling them.
    cancel-actions: false
    # Only review long-range block interactions to avoid normal close-range clicks.
    min-check-distance: 5.5
    # Maximum range for block/entity Line of Sight review.
    max-distance: 7.0

  no-slow:
    enabled: true
    # Consecutive suspicious movement samples required before an alert.
    required-samples: 5
    setback:
      enabled: true
      # Permit a few small steps; confirm after at least this many samples and
      # the configured cumulative suspicious displacement (0.10-0.30 blocks).
      minimum-samples: 2
      threshold-distance: 0.18
    # Cancel item consumption after a confirmed violation.
    cancel-consume: true
    # Allow NoSlow to interrupt food use after a confirmed violation.
    # Set false to keep food use uninterrupted while still detecting NoSlow.
    reset-food: true
    # Include potion-based movement modifiers and Dolphin's Grace in the allowance.
    # When false, the check uses the base movement attribute and ignores Dolphin's Grace bonus.
    potion-effects: true
    block-friction: true

  no-web:
    enabled: true
    # Vanilla cobweb horizontal movement is about 25% of ordinary walking speed.
    # The check evaluates horizontal displacement only; vertical cobweb movement
    # varies with entry momentum, gravity and potion physics.
    # Effective allowance accounts for attributes, potions, sprint, sneak, shield,
    # Weaving and walk speed.
    max-move-distance: 0.062
    movement-buffer: 0.002
    # A wider tolerance reduces sensitivity to legitimate packet timing and movement variation.
    speed-multiplier: 1.06
    # Require sustained horizontal excess over several server ticks before adding violation level.
    required-samples: 4
    # Ignore short server-applied impulses such as knockback while re-baselining.
    velocity-grace-ms: 500
    # Ignore NoWeb during Elytra flight and briefly after a glide transition.
    elytra-grace-ms: 2500
    # Ignore stale/teleport movement samples after an Ender Pearl landing.
    pearl-grace-ms: 1500

  ghost-menu:
    enabled: true
    # Ignore momentum immediately after opening a server-side container.
    open-grace-ms: 1200
    # Recheck movement after velocity changes or damage to avoid knockback false positives.
    velocity-grace-ms: 1000
    # Require sustained movement faster than an ordinary walk.
    # The server can reliably confirm container GUIs, but not the open/closed
    # state of the client-side E inventory from a window-0 click alone.
    require-sprint: false
    minimum-horizontal-speed: 2.5
    required-samples: 4
    required-duration-ms: 250
    required-distance: 0.65
    sample-window-ms: 1200
    max-ping-ms: 250
    # Movement is only reviewed while the server-side GUI is actually open.
    # Violation levels continue across GUI sessions and reset on quit/world change.
    # Return to the last safe position at x3, following the NoWeb correction model.
    setback:
      enabled: true
    log-context: true

  auto-swap:
    enabled: true
    # PacketEvents CLICK_WINDOW / SWAP events, including swaps in open containers.
    # Hotbar keys (0-8) and offhand key (40) are counted. Alerts are advisory.
    required-swaps: 8
    window-ms: 1500

  silent-swap:
    enabled: true
    # Require two repeated silent-swap cycles without a matching main-hand swing.
    # Packet bursts shorter than 4 ms are valid and are not discarded.
    required-cycles: 2
    max-cycle-ms: 100
    # Window-0 inventory SWAP -> attack -> same SWAP restore sequence.
    inventory-max-cycle-ms: 180
    observation-window-ms: 1600
    # Correlate a normal main-hand animation packet before/after the attack.
    swing-correlation-ms: 140
    # Delay the review briefly so a same-batch / slightly delayed swing packet can arrive.
    review-delay-ticks: 3
    max-ping-ms: 250
    # Confirmed hotbar and window-0 inventory SWAP/action sequences are tracked; unrelated clicks are excluded.
    log-context: true

  motion:
    enabled: true
    # Five independently sampled anomalies inside this rolling window trigger an alert.
    required-suspicions: 5
    suspicion-window-ms: 3000
    # Motion re-review cadence follows alerts.delay-seconds.
    # Ignore movement shortly after server-side velocity changes (knockback, explosions, etc.).
    velocity-grace-ms: 1200
    # Ignore Motion samples briefly when elytra gliding starts or stops.
    glide-grace-ms: 3000
    max-ping-ms: 250
    hover:
      # Require a sustained near-stationary vertical position while airborne.
      vertical-tolerance: 0.015
      velocity-tolerance: 0.035
      confirm-ticks: 12
    # On a confirmed Motion violation, rubberband to the latest valid jump/ground point.
    # The shared movement-setback settings add the millimetre offset and short correction lock.
    setback:
      enabled: true
      # Only use a jump origin saved recently (milliseconds).
      jump-origin-max-age-ms: 3000
      # Maximum age of the last grounded rollback point when no recent jump exists.
      safe-position-max-age-ms: 15000
    # PacketEvents horizontal movement analysis against the estimated vanilla speed.
    # A small excess is reviewed over a smoothed window to reduce packet-jitter noise.
    speed:
      multiplier: 1.025
      buffer-bps: 0.04
      confirm-samples: 3
      sample-window-ms: 500
    # Minimum interval between independent packet anomaly signals, not alert delivery.
    packet-signal-interval-ms: 400
    # Log potion effects, effective movement attribute, velocity and movement states to console.
    log-context: true

  elytra-speed:
    enabled: true
    # Maximum allowed averaged 3D flight speed, measured over a 400 ms packet window.
    max-bps: 45.1
    # Consecutive over-limit smoothed windows required to confirm a violation.
    confirm-samples: 2
    max-ping-ms: 250
    log-context: true
    setback:
      enabled: true
      # Return to the last grounded position if it is still reasonably recent.
      safe-position-max-age-ms: 30000
      # Stop elytra flight and hard-freeze movement after the rollback.
      freeze-duration-ms: 2500

  baritone:
    enabled: true
    # Only review stable, on-ground navigation with a low, steady ping.
    max-ping-ms: 220
    # Repeated route-shape analysis window and required matching turn sequence.
    observation-window-ms: 45000
    pattern-segments: 4
    required-repeats: 3
    # A repeat must keep both turn angle and distance between turns consistent.
    angle-tolerance-degrees: 10.0
    segment-distance-tolerance: 0.40
    minimum-turn-degrees: 25.0
    maximum-turn-degrees: 155.0
    minimum-segment-distance: 1.0
    maximum-segment-distance: 12.0
    yaw-turn-tolerance-degrees: 28.0
    # Advisory only: Baritone is not directly identifiable from movement packets.
    # This check alerts on repeated automated-looking ground-navigation patterns.
    log-context: true
  baritone-a:
    enabled: true
    # Separate Baritone (A) review: repeated precise camera-to-travel steering.
    max-ping-ms: 220
    observation-window-ms: 25000
    velocity-grace-ms: 1200
    # Requires multiple independent direction changes with closely correlated yaw.
    required-turns: 8
    # Additional matched turns required before the next escalation.
    alert-step: 4
    minimum-turn-degrees: 18.0
    maximum-turn-degrees: 150.0
    minimum-segment-distance: 0.65
    maximum-segment-distance: 10.0
    yaw-turn-tolerance-degrees: 12.0
    maximum-average-yaw-error-degrees: 8.0
    # Rotation-snap-density signal: repeated horizontal yaw steps with stable pitch.
    rotation-snap-required-count: 7
    rotation-snap-min-yaw-degrees: 12.0
    rotation-snap-max-yaw-degrees: 150.0
    rotation-snap-max-pitch-degrees: 0.75
    rotation-snap-max-average-pitch-degrees: 0.45
    rotation-snap-min-travel-distance: 4.0
    # Advisory only: this is a movement-pattern signal, not proof of a named client.
    log-context: true

  scaffold:
    enabled: true
    # Advisory placement consistency review only; no actions are cancelled.
    threshold: 5
    violation-decay: 0.05
    max-ping-ms: 250

  aim:
    enabled: true
    # Aim is advisory: it alerts staff and never cancels an attack by itself.
    observation-window-ms: 8000
    # Review repeated accurate attacks against targets that are actually moving.
    accurate-angle-degrees: 3.5
    very-accurate-angle-degrees: 1.4
    minimum-target-speed: 0.08
    required-moving-hits: 8
    # Rotation approach and consistency are supporting signals, never standalone flags.
    required-smooth-approaches: 4
    stable-angle-deviation: 0.65
    # Skip unreliable samples during high-latency play.
    max-ping-ms: 250

  reach:
    enabled: true
    # Base survival reach. Ping adds a small bounded tolerance; it never disables this check.
    base-distance: 3.10
    # The target hitbox is rewound by attacker ping, up to this maximum.
    max-rewind-ms: 500
    # Additional reach allowance grows with ping but is capped at max-ping-buffer.
    ping-buffer-per-ms: 0.002
    max-ping-buffer: 0.85
    # Repeated suspicious attack packets are required before alerting/cancelling.
    required-hits: 3
    window-ms: 2500
    cancel-hits: true

  inv-hit:
    enabled: true
    # Cancel attack packets and alert when a player attacks while a server GUI is open.
    cancel-hits: true
    # The normal E inventory screen is client-side; detect window-0 clicks and
    # retain a short best-effort signal for attacks immediately after a click.
    personal-inventory-click-grace-ms: 650

evidence:
  enabled: true
  # In-memory history is bounded to protect server memory.
  max-players: 512
  max-per-player: 40

alerts:
  enabled: true
  # Real-time minimum delay between alerts for the same player and check.
  # Suppressed one-shot alerts are queued and delivered after this interval.
  # The x1, x2, x3 sequence advances only when the alert is actually sent.
  delay-seconds: 3
  # Send alerts to console as well as opted-in staff.
  console: true
  # Supports legacy & color codes and placeholders:
  # {prefix}, {player}, {check}, {vl}, {reason}, {ping}, {tps}
  # Hover over the check name in-game to view player, reason, ping, TPS and VL.
  format: "{prefix} &f{player} &7failed &c{check} &8(x{vl})"
  prefix: "&bKeenAC &8»"

  # Automatically enable alert reception for players with keenac.alerts permission.
  auto-enable-for-staff: true

commands:
  # Permission nodes are also declared in plugin.yml.
  use-permission: "keenac.use"
  alerts-permission: "keenac.alerts"
  reload-permission: "keenac.reload"
  review-permission: "keenac.review"
